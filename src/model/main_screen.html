<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<script>
  
</script>
<style>
  button{
    width: 20rem;
    height: 5rem;
    border: transparent;
    font-size: 22px;
    font-weight: 500;
    background-color: rgb(0, 142, 213);
    color: #fff;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.3s;
  }
  button::after{
    background-color: darkblue;
    height: 5rem;
  }
  button:hover{
    box-shadow: 0px 0px rgb(0, 100, 150);
  }
  #versus{
    background-color: grey;
    box-shadow: 2px 2px rgb(84, 83, 83);
  }

  .player-leaderboard{
    background-color: blue;
    padding: 0.6rem;
    border-radius: 4px;
    display: flex;
    flex-direction: row;

  }
  .scoreboard-panel{
    border-radius: 4px;
    padding: 1rem;
  }
  main{
    display: grid;
    grid-column: 2;
  }

</style>
<body>
  <main>
    <div class="top">
      <h1>Ocean Builder</h1>
    </div>
    <div class="action-button">
      <button id="play">Play</button>
      <button id="versus">Teams (Coming later)</button>
      <button>Option</button>
    </div>
    <div class="scoreboard-panel">
      <h3>Score Board</h3>
      <section id="player">
        <div class="player-leaderboard">
          <h4>Player Name 1</h4>
          <p>2.5B $</p>
        </div>
        <div class="player-leaderboard">
          <h4>Player Name 2</h4>
          <p>1.2B $</p>
        </div>
        <div class="player-leaderboard">
          <h4>Player Name 3</h4>
          <p>800M $</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
