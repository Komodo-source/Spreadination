<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Market — Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body{
      background-image: url(./assets/TSAKOS-OCTOBER-7.jpeg);
      background-size: cover;
    }
    form{
      display: flex;
      flex-direction: column;
      width: 100%;
      margin-top: 8rem;
      gap: 1rem;
    }
    .main-column{
      background-color: rgba(128, 128, 128, 0.422);

      margin-left: 10rem;
      bottom: 100;
      height: 100%;
      position: absolute;
      text-align: center;
    }
    h1{
      margin: 0 2rem;
    }

    input{
      cursor: pointer;
      padding: 0.3rem;
    }

    .error{
      color: #ffdddd;
      min-height: 1.2rem;
      margin-top: 0.75rem;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <main>
    <div class="main-column">
      <h1>Ocean Market</h1>
      <form action="" method="post">
        <input type="text" name="user_name" placeholder="username" autocomplete="username" required>
        <input type="password" name="password" placeholder="password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>
      <p class="error" id="error" role="alert"></p>
      <a href="register.html">No account?</a>
    </div>
  </main>

  <script>
    // Backend base URL. Override with window.OCEAN_MARKET_API_URL if needed.
    const API_URL = (window.OCEAN_MARKET_API_URL || 'http://localhost:3001').replace(/\/+$/, '');

    const form = document.querySelector('form');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            user_name: form.user_name.value.trim(),
            password: form.password.value,
          }),
        });

        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error((payload && payload.error) || `Login failed (${response.status})`);
        }

        // Same keys src/api.js reads on startup.
        localStorage.setItem('oceanMarket.token', payload.token);
        localStorage.setItem('oceanMarket.playerId', payload.player.id_player);

        window.location.href = '/';
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
